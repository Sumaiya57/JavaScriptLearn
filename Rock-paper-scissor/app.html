<!DOCTYPE html>
<head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="app.css">
    </head>
    <body>
        <h1>Rock Paper Scissors</h1>
         <div class="choices">
            <div class="choice" id="rock">
                <img src="Rock-paper-scissor\images\rock.png">
            </div>
            <div class="choice" id="paper">
                <img src="Rock-paper-scissor\images\paper.png">
            </div>
            <div class="choice" id="scissors">
                <img src="Rock-paper-scissor\images\scissors.png">
            </div>
         </div>
         <div class="count">
            <div class="user-score">
                <p>user</p>
                <p id="count1">0</p>
            </div>
            <div class="comp-score">
                <p>comp</p>
                <p id="count2">0</p>
            </div>
            <p>user</p>

         </div>
         <div class="msg-container">
            <p id="msg"></p>
         </div>
    </body>
</html>
